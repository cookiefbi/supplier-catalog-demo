<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>База постачальників</title>
<meta name="description" content="Демо каталогу постачальників з Китаю у форматі Telegram Mini App">
<meta name="theme-color" content="#EFEFF4">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#EFEFF4; --section:#FFFFFF; --text:#000000; --hint:#636368; --sep:rgba(60,60,67,.18);
  --link:#1E73BE; --btn:#1E73BE; --btn-text:#FFFFFF; --field:#E3E3E8;
  --brass:#8C6A33; --brass-soft:#F3EBDD; --brass-ink:#6E5226;
  --ok:#2E9E5B; --ok-text:#1E7F45; --stub:#FAF8F3; --perf:#C9C2B4;
  --chat-bg:#D9E4CF; --bubble-in:#FFFFFF; --bubble-out:#E1FEC6;
  --shadow:0 8px 28px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --section:#1C1C1E; --text:#FFFFFF; --hint:#98989F; --sep:rgba(84,84,88,.6);
  --link:#5EB5F7; --btn:#1A72BA; --btn-text:#FFFFFF; --field:#2C2C2E;
  --brass:#D2AE74; --brass-soft:#2E2618; --brass-ink:#E4C793;
  --ok:#4CC97D; --ok-text:#4CC97D; --stub:#232220; --perf:#4A463F;
  --chat-bg:#0E1621; --bubble-in:#182533; --bubble-out:#2B5278;
  --shadow:0 10px 30px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.35 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:color-mix(in srgb,var(--btn) 30%,transparent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.list :focus-visible,.access :focus-visible,.plans :focus-visible{outline-offset:-2px;border-radius:inherit}
input{font:inherit;color:inherit;caret-color:var(--btn)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

#app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:500px){body{background:color-mix(in srgb,var(--bg) 70%,#808080)}#app{box-shadow:0 0 0 1px var(--sep)}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.view.enter{animation:enter .34s cubic-bezier(.2,.8,.2,1) both}
.view.leave{animation:leave .34s cubic-bezier(.2,.8,.2,1) both}
.view.enter-back{animation:enterBack .34s cubic-bezier(.2,.8,.2,1) both}
.view.leave-back{animation:leaveBack .34s cubic-bezier(.2,.8,.2,1) both;z-index:2}
@keyframes enter{from{transform:translateX(100%)}to{transform:none}}
@keyframes leave{to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes enterBack{from{transform:translateX(-28%);filter:brightness(.92)}to{transform:none}}
@keyframes leaveBack{to{transform:translateX(100%)}}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.scroll::-webkit-scrollbar{width:0}

/* top bar */
.bar{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px;background:var(--section);border-bottom:.5px solid var(--sep);flex:none}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{display:block;font-size:12.5px;font-weight:400;color:var(--hint)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--link)}
.icon-btn:active{background:var(--field)}
.back{display:flex;align-items:center;gap:0;color:var(--link);font-size:17px;padding:0 8px 0 2px;height:44px;min-width:44px}
.back svg{width:26px;height:26px;stroke-width:2}

/* home */
/* entry to the admin story: a pushed screen, so it reads as a row with a chevron, not a tab */
.admin-entry{margin-top:12px}
.admin-entry .t{display:flex;flex-direction:column;gap:2px;padding:9px 0}
.admin-entry .t small{font-size:13px;color:var(--hint)}
.search{display:flex;align-items:center;gap:6px;margin:12px 16px 0;height:38px;padding:0 10px;border-radius:10px;background:var(--field);color:var(--hint)}
.search svg{width:18px;height:18px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--hint)}
.access{margin:16px 16px 0;padding:12px 14px;border-radius:12px;background:var(--section);display:flex;align-items:center;gap:12px}
.access .seal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brass-soft);color:var(--brass)}
.access .seal svg{width:18px;height:18px}
.access b{display:block;font-size:15px;font-weight:600}
.access span{font-size:13px;color:var(--hint)}
.access .go{margin-left:auto;color:var(--link);font-size:15px;font-weight:500;padding:8px 0 8px 8px}
.access.full .seal,.access.some .seal{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
/* partial access: the row opens "Мої контакти", the trailing link sells the whole base */
.access.some{padding:0;flex-direction:column;align-items:stretch;gap:0;overflow:hidden}
.access-main{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.access-main > div{flex:1;min-width:0}
.access-main .chev{width:16px;height:16px;color:var(--hint);opacity:.6;stroke-width:2.2;flex:none}
.access-main:active,.access.some .go:active{background:var(--field)}
.access.some .go{margin:0;padding:0 14px 0 60px;min-height:44px;text-align:left;position:relative}
.access.some .go::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.access .go{white-space:nowrap;flex:none}
.cap{margin:22px 32px 6px;font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.02em}
.list{margin:0 16px;background:var(--section);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px 0 14px;text-align:left;position:relative}
.row:active{background:var(--field)}
.row + .row::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 17%,var(--section));flex:none}
:root[data-theme="dark"] .ic{color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 22%,var(--section))}
.ic svg{width:19px;height:19px;stroke-width:2.1}
/* photo-less suppliers: the category tile stands in, at list size on cards and a step up in the supplier header */
.card .ic{width:40px;height:40px}
.card .ic svg{width:22px;height:22px}
.sup-id{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.sup-id .ic{width:44px;height:44px;border-radius:10px}
.sup-id .ic svg{width:24px;height:24px}
.sup-id h2{margin:0}
.row .t{flex:1;font-size:16px;font-weight:400;padding:12px 0}
.row .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;color:var(--hint);min-width:2.4ch;text-align:right}
.row .chev{width:16px;height:16px;color:var(--hint);opacity:.6;stroke-width:2.2}
.row .own{width:16px;height:16px;color:var(--ok);stroke-width:2.4}
.foot{margin:18px 32px 0;font-size:13px;color:var(--hint);line-height:1.4}

/* supplier cards */
.cat-head{padding:16px 16px 4px;display:flex;align-items:baseline;gap:8px}
.cat-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.cat-head span{color:var(--hint);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--section);font-size:14px;font-weight:500;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--section)}
.cards{display:grid;gap:12px;padding:12px 16px 0}
.card{background:var(--section);border-radius:14px;overflow:hidden;text-align:left;width:100%;display:block}
.card:active{transform:scale(.99)}
.card-main{display:flex;gap:12px;padding:12px}
.ph{position:relative;flex:none;width:72px;height:72px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cnt{position:absolute;right:5px;bottom:5px;font:600 11px/1 var(--sans);color:#fff;background:rgba(0,0,0,.45);padding:3px 5px;border-radius:6px}
.meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.meta h3{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.code{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.code span{font-family:var(--mono);padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--text)}
.hid{color:var(--hint)!important;display:inline-flex;align-items:center;gap:3px}
.hid svg{width:12px;height:12px;stroke-width:2.2;color:var(--brass)}
.cells .hid svg{width:14px;height:14px}
.ver{font-size:13px;color:var(--hint);display:flex;align-items:center;gap:5px}
.ver i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.ver.old i{background:var(--hint)}
.ver .mono{color:var(--text)}
.goods{font-size:13.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tear-off stub: the signature */
.stub{position:relative;background:var(--stub);min-height:46px;overflow:hidden}
.stub::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:radial-gradient(circle,var(--perf) 1.1px,transparent 1.4px) 0 0/7px 2px repeat-x;z-index:3}
/* the cover carries the lower half of the perforation away when torn */
.cover::before,.big-cover::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:radial-gradient(circle,var(--perf) 1.1px,transparent 1.4px) 0 -1px/7px 2px repeat-x}
.stub.tearing::before{background-position:0 1px}
.stub-in{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 14px;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.stub-in .f{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stub-in svg{width:16px;height:16px;color:var(--hint)}
.cover{position:absolute;inset:0;z-index:2;background:var(--stub);display:flex;align-items:center;gap:10px;padding:0 14px;transform-origin:12% 0;color:var(--hint);font-family:var(--mono);font-size:13.5px}
.cover .dots{flex:1;letter-spacing:.12em;white-space:nowrap;overflow:hidden}
.pin{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--brass-soft);color:var(--brass-ink);font:600 13px/1 var(--sans);flex:none}
.pin svg{width:15px;height:15px;color:var(--brass);stroke-width:2}
.stub.open .cover{display:none}
.stub.tearing .cover{display:flex;animation:tear .62s cubic-bezier(.3,.7,.2,1) forwards}
.stub.tearing .stub-in{animation:reveal .5s .12s ease-out both}
@keyframes tear{0%{transform:none}35%{transform:translateY(3px) rotate(-1.5deg)}100%{transform:translate(18px,58px) rotate(7deg);opacity:0}}
@keyframes reveal{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.stub.open .stub-in .f{color:var(--text)}

/* supplier page */
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--section)}
.gallery::-webkit-scrollbar{display:none}
.gallery > *{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/4.4;display:grid;place-items:center}
.gallery img{width:100%;height:100%;object-fit:cover}
.gdots{display:flex;justify-content:center;gap:6px;padding:10px 0 0;background:var(--section)}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--sep)}
.gdots i.on{background:var(--text)}
.sup-head{background:var(--section);padding:12px 16px 16px}
.sup-head.flat{padding-top:16px}
.sup-head h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.015em}
.sup-head .goods{white-space:normal;font-size:15px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 0;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.cells div{padding:8px 10px 8px 0}
.cells div + div{border-left:.5px solid var(--sep);padding-left:10px}
.cells small{display:block;font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.03em}
.cells b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.contact-tag{margin:16px 16px 0;border-radius:14px;overflow:hidden;background:var(--section)}
.contact-tag .stub{min-height:0}
.ct-rows{position:relative}
.ct-row{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.ct-row + .ct-row::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--sep)}
.ct-row .k{font:13px/1 var(--sans);color:var(--hint);margin-bottom:4px;display:block}
.ct-row .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;word-break:break-word}
.ct-row .v.cn{font-family:var(--sans);font-size:13px;color:var(--hint);margin-top:2px}
.ct-row .v.addr{font-family:var(--sans);font-size:15px}
.nb{white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ct-row > div{flex:1;min-width:0}
.ct-row .ico{width:26px;height:26px;color:var(--hint)}
.copy{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--link)}
.copy:active{background:var(--field)}
.big-cover{position:absolute;inset:0;z-index:2;background:var(--stub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;transform-origin:10% 0}
.big-cover .dots{font-family:var(--mono);color:var(--hint);letter-spacing:.12em;font-size:14px;line-height:1.9}
.stub.open .big-cover{display:none}
.stub.tearing .big-cover{animation:tear .7s cubic-bezier(.3,.7,.2,1) forwards}
.stub.tearing .ct-rows{animation:reveal .55s .15s ease-out both}
.note{margin:16px 16px 0;background:var(--section);border-radius:14px;padding:14px}
.note h4{margin:0 0 6px;font-size:13px;color:var(--hint);font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.note p{margin:0;font-size:15px;line-height:1.45}
.note.locked p{color:var(--hint)}
.mainbtn-wrap{flex:none;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.mainbtn{width:100%;height:50px;border-radius:12px;background:var(--btn);color:var(--btn-text);font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.mainbtn:active{filter:brightness(.92)}
.mainbtn[disabled]{opacity:.7}
.mainbtn .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fade .25s ease-out both}
.scrim.out{animation:fade .22s ease-in reverse both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 0 0;animation:up .36s cubic-bezier(.2,.85,.25,1) both;max-height:92%;display:flex;flex-direction:column}
.sheet.out{animation:down .24s ease-in both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 6px}
.sheet-h{display:flex;align-items:center;padding:4px 8px 4px 16px}
.sheet-h h3{flex:1;margin:0;font-size:19px;font-weight:700}
.plans{margin:10px 16px 0;background:var(--section);border-radius:12px;overflow:hidden}
.plan{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;position:relative}
.plan + .plan::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:.5px solid var(--sep)}
.radio{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--hint);flex:none;display:grid;place-items:center}
.plan[aria-checked="true"] .radio{border-color:var(--btn);background:var(--btn)}
.plan[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.plan .pt{flex:1;min-width:0}
.plan .pt b{display:block;font-size:16px;font-weight:600}
.plan .pt span{font-size:13.5px;color:var(--hint)}
.plan .price{font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;white-space:nowrap}
.plan .per{display:block;font:12px var(--sans);color:var(--ok-text);text-align:right;margin-top:2px}
.fine{margin:10px 32px 0;font-size:12.5px;color:var(--hint);text-align:center}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:rgba(30,30,30,.92);color:#fff;font-size:14px;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:8px;animation:toast 1.9s ease both;white-space:nowrap}
.toast svg{width:18px;height:18px;color:#4CD964;stroke-width:2.4}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* on the supplier page the contacts sit low; the toast drops from under the top bar instead of covering them */
.toast.top{bottom:auto;top:64px;animation-name:toast-top}
@keyframes toast-top{0%{opacity:0;transform:translate(-50%,-8px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* bot chat */
.chat-bar{display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 2px;background:var(--section);border-bottom:.5px solid var(--sep);flex:none}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:#3F8FD8}
.ava svg{width:21px;height:21px}
.chat-bar .who{flex:1;min-width:0}
.chat-bar .who b{display:block;font-size:16px;font-weight:600}
.chat-bar .who span{font-size:13px;color:var(--link)}
.chat{flex:1;overflow-y:auto;background:var(--chat-bg);padding:12px 10px 16px;display:flex;flex-direction:column;gap:6px}
.chat::-webkit-scrollbar{width:0}
.day{align-self:center;font-size:13px;font-weight:500;color:#fff;background:rgba(0,0,0,.25);padding:3px 10px;border-radius:12px;margin:2px 0 6px}
.msg{max-width:84%;border-radius:16px;padding:7px 10px 6px;font-size:15px;line-height:1.35;position:relative;animation:pop .28s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 1px 1px rgba(0,0,0,.08)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:6px}
.msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:6px}
.msg .time{float:right;font-size:11.5px;color:var(--hint);margin:6px 0 -2px 10px}
.msg.out .time{color:color-mix(in srgb,var(--ok) 80%,var(--hint))}
.fwd{font-size:14px;color:var(--link);margin-bottom:4px;display:flex;gap:5px;align-items:center}
.fwd svg{width:15px;height:15px}
.fwd b{font-weight:600}
.media{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;border-radius:10px;overflow:hidden;margin:2px -4px 6px;aspect-ratio:1.25}
.media > *:first-child{grid-row:1/3}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.mingpian{background:#FBF8F1;color:#1d1d1d;display:flex;flex-direction:column;justify-content:center;padding:6px 7px;font-size:8px;line-height:1.4;white-space:nowrap;overflow:hidden;position:relative;font-family:"PingFang SC","Microsoft YaHei",var(--sans)}
.mingpian b{font-size:12px;letter-spacing:.06em}
.mingpian em{font-style:normal;font-size:7px;letter-spacing:.08em;color:#555;margin-bottom:4px}
.mingpian .seal-r{position:absolute;right:6px;top:6px;width:18px;height:18px;border:1.5px solid #C4382A;color:#C4382A;font-size:9px;display:grid;place-items:center;border-radius:2px;transform:rotate(-6deg)}
.rec{background:var(--bg);border-radius:10px;margin:6px -2px 4px;overflow:hidden}
.rec div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-size:14px}
.rec div + div{border-top:.5px solid var(--sep)}
.rec span{color:var(--hint)}
.rec b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;display:flex;align-items:center;gap:5px}
.rec b svg{width:14px;height:14px;color:var(--ok);stroke-width:2.6}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-self:flex-start;width:84%;animation:pop .28s .05s cubic-bezier(.2,.8,.2,1) both}
.kb.one{grid-template-columns:1fr}
.kb.three{grid-template-columns:1fr 1fr 1fr}
.kb button{min-height:40px;border-radius:10px;background:#5C6C58;color:#fff;font-size:15px;font-weight:500;padding:6px 8px}
:root[data-theme="dark"] .kb button{background:#2A3B4D}
.kb button:active{filter:brightness(1.15)}
.kb button[disabled]{cursor:default}
.kb button.chosen{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.typing{align-self:flex-start;background:var(--bubble-in);border-radius:16px;border-bottom-left-radius:6px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--hint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--section);border-top:.5px solid var(--sep)}
.composer input{flex:1;height:38px;border-radius:19px;border:.5px solid var(--sep);background:var(--bg);padding:0 14px;outline:none;font-size:16px}
.composer .send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff}
.composer .send svg{width:19px;height:19px;stroke-width:2.2}
.replay{display:flex;align-items:center;gap:6px;color:var(--link);font-size:15px;padding:0 8px;height:44px}

.empty{margin:40px 32px;text-align:center;color:var(--hint);font-size:15px}
.empty svg{width:40px;height:40px;stroke-width:1.3;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const ic=(n,c="i")=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n.toLocaleString("uk-UA").replace(/ /g," ")+" ₴";
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const TODAY=new Date(2026,10,24);
const fmtD=d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
const daysAgo=n=>{const d=new Date(TODAY);d.setDate(d.getDate()-n);return d};

/* ---------- mock data (all invented) ---------- */
const CATS=[
 {id:"women",name:"Жіночий одяг",n:46,icon:"dress",color:"#E0567A",suf:["Fashion","Lady","Mode","Style"],
  goods:["сукні, костюми","трикотажні сукні","денім, сорочки","вечірні сукні","базовий одяг"],markets:[["Шісаньхан","十三行"],["Чжаньсі","站西"],["Байма","白马"]]},
 {id:"men",name:"Чоловічий одяг",n:31,icon:"shirt",color:"#3A78D8",suf:["Men","Gentle","Homme","Wear"],
  goods:["сорочки, поло","куртки, парки","костюми","спорт-шик","джинси"],markets:[["Чжаньсі","站西"],["Байма","白马"],["Шахе","沙河"]]},
 {id:"kids",name:"Дитяче",n:22,icon:"kids",color:"#F29A2E",suf:["Kids","Baby","Little","Mini"],
  goods:["0–3 роки","школа 7–14","комбінезони","піжами","верхній одяг"],markets:[["Шахе","沙河"],["Чжаньсі","站西"]]},
 {id:"shoes",name:"Жіноче взуття",n:27,icon:"heel",color:"#B04FC9",suf:["Shoes","Step","Heels","Walk"],
  goods:["туфлі, лофери","кросівки","чоботи","босоніжки","ботильйони"],markets:[["Байюнь Шуз","白云鞋城"],["Цзіньлун","金龙"]]},
 {id:"fur",name:"Шуби",n:14,icon:"coat",color:"#9A6B45",suf:["Fur","Mink","Fox","Furs"],
  goods:["норка, лис","мутон, дублянки","жилети з хутра","шуби з песця","комбіновані куртки"],markets:[["Шахе","沙河"],["Байма","白马"]]},
 {id:"knit",name:"Трикотаж",n:19,icon:"knit",color:"#D2643C",suf:["Knit","Wool","Yarn","Cashmere"],
  goods:["кашемір","светри, кардигани","трикотажні костюми","шапки, шарфи","водолазки"],markets:[["Канле","康乐"],["Шісаньхан","十三行"]]},
 {id:"bed",name:"Постільна білизна",n:11,icon:"bed",color:"#4E9FA6",suf:["Home","Textile","Sleep","Linen"],
  goods:["сатин, страйп-сатин","ковдри, подушки","дитяча постіль","готельний текстиль","пледи"],markets:[["Іу Футянь","义乌福田"],["Канле","康乐"]]},
 {id:"furn",name:"Меблі (Фошань)",n:17,icon:"sofa",color:"#6F7F45",suf:["Furniture","Living","Casa","Design"],
  goods:["дивани, крісла","столи, стільці","корпусні меблі","ліжка","меблі для кафе"],markets:[["Лецун","乐从"],["Лунцзян","龙江"]]},
 {id:"dish",name:"Посуд",n:9,icon:"cup",color:"#C44D4D",suf:["Ceramics","Kitchen","Table","Porcelain"],
  goods:["кераміка","скло, келихи","столові прибори","посуд для HoReCa","чайні набори"],markets:[["Іу Футянь","义乌福田"],["Чаочжоу","潮州"]]},
 {id:"tech",name:"Електроніка",n:24,icon:"chip",color:"#5A5FD6",suf:["Tech","Digital","Smart","Electronic"],
  goods:["аксесуари до телефонів","навушники","павербанки","смарт-годинники","кабелі, зарядки"],markets:[["Хуацянбей","华强北"]]},
 {id:"outlet",name:"Аутлет",n:12,icon:"tag",color:"#2E9E73",suf:["Stock","Outlet","Lots","Sale"],
  goods:["сток брендів","залишки колекцій","мікс на вагу","взуттєвий сток","ліквідація"],markets:[["Шахе","沙河"],["Байма","白马"]]},
 {id:"oem",name:"Фабрики під ваш бренд",n:8,icon:"factory",color:"#55606E",suf:["Factory","Garment","Manufacture","OEM"],
  goods:["пошив від 300 шт","трикотаж під лейбл","взуття під бренд","упаковка, бірки","спортивний одяг"],markets:[["Дунгуань","东莞"],["Хумень","虎门"],["Цзіньцзян","晋江"]],factory:true},
];
const A=["Snow","Golden","Lucky","Jade","Silk","Red","Moon","Cloud","Lotus","Pearl","Star","Mei","Ling","Xin","Hua","Bright","Sun","Blue","Plum","Ocean"];
const B=["Fox","Line","House","Way","Garden","Bridge","Wing","Leaf","River","Field","Peak","Lane","Gate","Stone"];
const NOTES=[
 "Відповідає швидко, краще писати зранку за Києвом. Фото складу шле в той же день.",
 "Мінімалка невелика, можна мікс розмірів. Ціни нижчі, якщо береш від 20 шт.",
 "Привозить нові моделі щопонеділка. Англійською не говорить — пишіть через перекладач.",
 "Працюють з карго, самі передають на склад. Брак міняють без питань.",
 "Є шоурум на поверсі вище, туди варто зайти особисто. Дають знижку постійним.",
];
const DB={};const BY_ID={};
CATS.forEach((c,ci)=>{
  const r=rng(ci*977+13);const arr=[];
  for(let k=0;k<c.n;k++){
    const m=c.markets[Math.floor(r()*c.markets.length)];
    const name=A[Math.floor(r()*A.length)]+" "+B[Math.floor(r()*B.length)]+" "+c.suf[Math.floor(r()*c.suf.length)];
    const floor=c.factory?null:(1+Math.floor(r()*5))+"F";
    const stall=c.factory?null:String.fromCharCode(65+Math.floor(r()*4))+"-"+(100+Math.floor(r()*380));
    const ago=Math.floor(r()*r()*60);
    const wx="demo_"+(name.split(" ")[0]+"_"+name.split(" ")[1]).toLowerCase()+"_"+(10+Math.floor(r()*89));
    const ph="+86 100 0000 "+String(1000+Math.floor(r()*8999));
    const s={id:c.id+"-"+k,cat:c.id,name,market:m[0],marketCn:m[1],floor,stall,
      verified:daysAgo(ago),ago,goods:c.goods[Math.floor(r()*c.goods.length)],
      moq:c.factory?"від "+(3+Math.floor(r()*5))*100+" шт":"від "+(1+Math.floor(r()*5))+" шт на модель",
      wechat:wx,phone:ph,note:NOTES[Math.floor(r()*NOTES.length)],photos:[],tone:Math.floor(r()*4)};
    arr.push(s);
  }
  arr.sort((a,b)=>a.ago-b.ago);
  DB[c.id]=arr;
});
// hero supplier with real market photos
Object.assign(DB.fur[0],{name:"Snow Fox Fur",market:"Шахе",marketCn:"沙河",floor:"3F",stall:"A-218",verified:daysAgo(2),ago:2,
  goods:"шуби з лиса й песця, норкові куртки, мутон",moq:"від 2 шт на модель",wechat:"demo_snowfox_218",phone:"+86 100 0000 4172",
  note:"Свій цех у Хебеї, тому ціни нижчі за сусідів. Лис і песець в наявності, норку шиють під замовлення за 10 днів. Мікс кольорів дозволяють.",
  photos:["img/fur-1.jpg","img/fur-2.jpg","img/fur-3.jpg"]});
// a few more Шуби suppliers get their own frames: img/fur-c*.jpg are crops of the approved fur-1..3 stall photos
[["img/fur-c1.jpg"],["img/fur-c2.jpg","img/fur-c3.jpg"],["img/fur-c4.jpg"],["img/fur-c5.jpg"]].forEach((p,k)=>DB.fur[k+1].photos=p);

const catOf=id=>CATS.find(c=>c.id===id);
const total=()=>CATS.reduce((a,c)=>a+DB[c.id].length,0);
const PRICE={one:200,cat:2000,all:15500};

/* ---------- state (memory only) ---------- */
const S={all:false,cats:new Set(),sups:new Set(),stack:[],justOpened:null,botDone:false};
const has=s=>S.all||S.cats.has(s.cat)||S.sups.has(s.id);

/* ---------- theme ---------- */
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#000000":"#EFEFF4";
  if(tg){try{tg.setHeaderColor(t==="dark"?"#1C1C1E":"#FFFFFF");tg.setBackgroundColor(t==="dark"?"#000000":"#EFEFF4")}catch(e){}}
  document.querySelectorAll("[data-theme-btn]").forEach(b=>{b.innerHTML=ic(t==="dark"?"sun":"moon");b.setAttribute("aria-label",t==="dark"?"Світла тема":"Темна тема")})}
setTheme(tg?tg.colorScheme:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
if(tg){tg.ready();tg.expand();tg.onEvent("themeChanged",()=>setTheme(tg.colorScheme))}
else matchMedia("(prefers-color-scheme: dark)").addEventListener("change",e=>setTheme(e.matches?"dark":"light"));
const toggleTheme=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ---------- placeholders ---------- */
const catTile=id=>{const c=catOf(id);return `<span class="ic" style="--c:${c.color}" aria-hidden="true">${ic(c.icon)}</span>`};
function thumb(s){
  if(s.photos.length)return `<div class="ph"><img src="${s.photos[0]}" alt="" loading="lazy">${s.photos.length>1?`<span class="cnt">${s.photos.length} фото</span>`:""}</div>`;
  return catTile(s.cat);
}
const mask=(str,keep)=>str.slice(0,keep)+str.slice(keep).replace(/[^\s+\-]/g,"•");

/* ---------- views ---------- */
const app=document.getElementById("app");
function mount(html,dir,after){
  const old=app.querySelector(".view:not(.leave):not(.leave-back)");
  const v=document.createElement("section");v.className="view";v.innerHTML=html;app.appendChild(v);
  if(old&&dir){v.classList.add(dir==="fwd"?"enter":"enter-back");old.classList.add(dir==="fwd"?"leave":"leave-back");
    setTimeout(()=>old.remove(),350)}else if(old)old.remove();
  if(dir==="back")v.style.zIndex=1;
  after&&after(v);
  if(dir){const h=v.querySelector("h1,.who b");if(h&&document.activeElement&&document.activeElement!==document.body)h.setAttribute("tabindex","-1"),h.focus({preventScroll:true})}
  if(tg){S.stack.length?tg.BackButton.show():tg.BackButton.hide()}
  return v;
}
/* Every screen is a history entry, so the system back gesture (outside Telegram too) steps up a level
   instead of leaving the demo. UI back buttons go through history.back(); popstate does the rendering. */
const hist=(mode)=>{try{history[mode]({d:S.stack.length,r:S.cur},"")}catch(_){}};
function go(route,push=true){if(push)S.stack.push(S.cur);S.cur=route;hist("pushState");render(route,"fwd")}
function back(){if(!S.stack.length)return;history.state&&history.state.d===S.stack.length?history.back():popTo(S.stack.length-1)}
function popTo(d){S.cur=S.stack[d];S.stack.length=d;render(S.cur,"back")}
addEventListener("popstate",e=>{
  const x=app.querySelector(".sheet [data-x]");if(x)x.click();
  const st=e.state;if(!st)return;
  if(st.d<S.stack.length)popTo(st.d);
  else if(st.d>S.stack.length){S.stack.push(S.cur);S.cur=st.r;render(S.cur,"fwd")}
});
if(tg)tg.BackButton.onClick(back);
function render(r,dir){
  if(r.v==="home")return homeView(dir,r);
  if(r.v==="cat")return catView(r.id,dir);

const REDUCED=matchMedia("(prefers-reduced-motion: reduce)");
/* Bring the contact stub into view before it tears, so the unlock is seen, not missed below the fold. */
function revealTag(v){
  const tag=v.querySelector(".contact-tag"),sc=v.querySelector(".scroll");
  if(!tag||!sc||REDUCED.matches)return 0;
  const t=tag.getBoundingClientRect(),r=sc.getBoundingClientRect(),m=16;
  let dy=0;
  if(t.bottom>r.bottom-m)dy=Math.min(t.bottom-r.bottom+m,t.top-r.top-m);
  else if(t.top<r.top+m)dy=t.top-r.top-m;
  if(Math.abs(dy)<4)return 0;
  sc.scrollTo({top:sc.scrollTop+dy,behavior:"smooth"});
  return 250;
}
function unlockVisible(){
  const v=app.querySelector(".view:not(.leave):not(.leave-back)");
  const stubs=[...v.querySelectorAll("[data-stub]")].filter(st=>has(BY_ID[st.dataset.stub])&&!st.classList.contains("open"));
  stubs.forEach(st=>{const c=st.closest(".card");if(c)c.setAttribute("aria-label",c.getAttribute("aria-label").replace("контакти закриті","контакти відкриті"))});
  const tear=()=>stubs.forEach(st=>{st.classList.add("tearing");setTimeout(()=>{st.classList.remove("tearing");st.classList.add("open")},720)});
  v.querySelectorAll("[data-stall].hid").forEach(el=>{const s=BY_ID[el.dataset.stall];if(has(s)){el.classList.remove("hid");el.removeAttribute("aria-label");el.textContent=s.stall}});
  const note=v.querySelector("[data-note]");
  if(note&&S.cur.v==="sup"){const s=BY_ID[S.cur.id];note.classList.remove("locked");note.querySelector("p").textContent=s.note}
  v.querySelectorAll(".mainbtn-wrap").forEach(w=>{const b=w.querySelector("[data-buy-one],[data-buy-cat]");if(!b)return;
    const ok=b.dataset.buyOne?has(BY_ID[b.dataset.buyOne]):(S.all||S.cats.has(b.dataset.buyCat));if(ok)w.remove()});
  const acc=v.querySelector(".access");if(acc){const d=document.createElement("div");d.innerHTML=accessRow();acc.replaceWith(d.firstElementChild)}
  v.querySelectorAll(".row[data-cat]").forEach(r=>{if((S.all||S.cats.has(r.dataset.cat))&&!r.querySelector(".own"))r.querySelector(".n").insertAdjacentHTML("beforebegin",ic("check","i own"))});
  /* layout is final now (main button removed); scroll, then tear once the stub is settling into view */
  const wait=stubs.length?revealTag(v):0;
  wait?setTimeout(tear,wait):tear();
}

    say(esc(b.textContent),"out");
    if(k==="pub")typing(900,()=>{
      if(!S.botDone){const c=catOf(data.cat);DB[data.cat].unshift({id:"new-1",cat:data.cat,name:data.name,market:data.market,marketCn:data.marketCn,floor:data.floor,stall:data.stall,verified:new Date(TODAY),ago:0,goods:"норка, лис, мутон",moq:"від 2 шт на модель",wechat:data.wechat,phone:data.phone,note:"Додано з посту каналу. Візитку перевірено.",photos:["img/fur-3.jpg","img/fur-1.jpg"],tone:0});BY_ID["new-1"]=DB[data.cat][0];S.botDone=true}
      else Object.assign(BY_ID["new-1"],{cat:BY_ID["new-1"].cat,name:data.name,wechat:data.wechat,phone:data.phone,market:data.market});
      say(`Готово. «${esc(data.name)}» тепер у категорії <b>${esc(catOf(data.cat).name)}</b> — там ${DB[data.cat].length} постачальників. Мітка «перевірено ${fmtD(TODAY)}».`);
      kb([["open","Подивитися в каталозі"]],"one");
    });
    else if(k==="fix")typing(600,()=>{say("Що виправити?");kb([["f-cat","Категорія"],["f-mkt","Ринок"],["f-wx","WeChat"],["f-ph","Телефон"]])});
    else if(k==="f-cat")typing(500,()=>{say("Оберіть категорію:");kb([["c-fur","Шуби"],["c-women","Жіночий одяг"],["c-outlet","Аутлет"]],"three")});
    else if(k==="f-mkt")typing(500,()=>{say("Оберіть ринок:");kb([["m-Шахе","Шахе"],["m-Байма","Байма"],["m-Шісаньхан","Шісаньхан"]],"three")});
    else if(k==="f-wx"||k==="f-ph"){mode=k;typing(500,()=>{say(k==="f-wx"?"Надішліть правильний WeChat ID.":"Надішліть правильний номер.");const i=v.querySelector("[data-inp]");i.value=k==="f-wx"?"demo_goldenmink_gz":"+86 100 0000 2874";i.focus()})}
    else if(k.startsWith("c-")){data.cat=k.slice(2);typing(700,recognized)}
    else if(k.startsWith("m-")){data.market=k.slice(2);data.marketCn={"Шахе":"沙河","Байма":"白马","Шісаньхан":"十三行"}[data.market];typing(700,recognized)}
    else if(k==="open"){S.stack=[{v:"home"}];S.cur={v:"cat",id:data.cat};hist("replaceState");render(S.cur,"fwd")}
  });
  const send=()=>{const i=v.querySelector("[data-inp]");const t=i.value.trim();if(!t)return;i.value="";say(esc(t),"out");
    if(mode==="f-wx"){data.wechat=t;mode=null;typing(700,recognized)}else if(mode==="f-ph"){data.phone=t;mode=null;typing(700,recognized)}
    else typing(600,()=>say("Перешліть мені пост з каналу — я сам розберу фото, візитку й підпис."))};
  v.querySelector("[data-send]").onclick=send;v.querySelector("[data-inp]").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
  v.querySelector("[data-replay]").onclick=start;
  start();
}

/* ---------- global events ---------- */
app.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-cat],[data-sup]");if(!t)return;
  if(t.matches("[data-back]"))return back();
  if(t.matches("[data-theme-btn]"))return toggleTheme();
  if(t.dataset.cat)return go({v:"cat",id:t.dataset.cat});
  if(t.dataset.sup)return go({v:"sup",id:t.dataset.sup});
  if(t.matches("[data-bot]"))return go({v:"bot"});
  if(t.matches("[data-mine]"))return go({v:"mine"});
  if(t.dataset.buyOne)return sheet({sup:t.dataset.buyOne});
  if(t.dataset.buyCat)return sheet({cat:t.dataset.buyCat,pre:"cat"});
  if(t.matches("[data-buy-all]"))return sheet({pre:"all"});
  if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy)}catch(_){}return toast("Скопійовано")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const x=app.querySelector(".sheet [data-x]");if(x)x.click()}});
S.cur={v:"home"};hist("replaceState");render(S.cur);
</script>
</body>
</html>
